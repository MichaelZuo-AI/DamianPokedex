<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e7474d"><meta name="description" content="Damian 的宝可梦图鉴。像小训练家一样探索宝可梦：看大图、听介绍、找伙伴。"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Damian 的图鉴">
<title>Damian 的宝可梦图鉴</title><link rel="icon" href="assets/pokeball.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><link rel="preload" as="image" href="assets/pikachu.png"><script type="module" src="app.mjs"></script>
</head>
<body>
<a class="skip-link" href="#pokemon-name">跳到宝可梦介绍</a>
<main class="device is-loading" aria-label="Damian 的宝可梦图鉴" aria-busy="true">
<header class="device-header"><span class="sensor" aria-hidden="true"></span><span class="lamps" aria-hidden="true"><i></i><i></i><i></i></span><p class="device-title">宝可梦图鉴</p><div class="header-tools"><span class="owner"><span class="owner-avatar" aria-hidden="true">D</span><span>训练家 Damian</span></span><button id="open-search" class="search-button" type="button" aria-haspopup="dialog" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>搜索</span></button></div></header>
<div id="load-error" class="load-error" hidden><h1>图鉴还没打开</h1><p>检查一下网络，再试一次吧。</p><button id="retry-load" class="primary-button" type="button">重新打开</button></div>
<div id="device-content">
<div class="screens">
<section class="bezel art-screen" aria-label="宝可梦的样子"><div class="screen-top"><span id="picture-label">伙伴资料</span><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div><div class="art-corners" aria-hidden="true"></div><span class="art-shadow" aria-hidden="true"></span><img id="pokemon-image" class="main-art" src="assets/pikachu.png" alt="皮卡丘" width="400" height="400" fetchpriority="high"><p id="main-image-status" class="main-image-status" hidden>图片暂时无法显示</p><button id="change-form" class="change-form" type="button" aria-haspopup="dialog" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8a8 8 0 0 1 13-2l2 2m0-5v5h-5M19 16A8 8 0 0 1 6 18l-2-2m0 5v-5h5"/></svg><span>换个样子</span></button></section>
<div class="hinge" aria-hidden="true"></div>
<section class="bezel info-screen" aria-labelledby="pokemon-name"><div class="profile-top"><p id="main-number" class="number">准备中</p><button id="open-more" class="more-button" type="button" aria-haspopup="dialog" disabled>更多资料 <span aria-hidden="true">›</span></button></div><h1 id="pokemon-name" tabindex="-1">打开图鉴中…</h1><div class="type-row"><div id="type-badges" class="type-badges"></div><button id="speak-button" class="listen" type="button" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 5 9H2v6h3l6 5zM15 8c3 2 3 6 0 8M18 5c5 4 5 10 0 14"/></svg><span id="speak-label">听介绍</span></button></div><p id="pokemon-story" class="story">一起认识你的宝可梦伙伴。</p><section class="evolution" aria-labelledby="evolution-title"><div class="section-heading"><h2 id="evolution-title">进化伙伴</h2><button id="open-family" class="small-button" type="button" hidden>看全部 <span aria-hidden="true">›</span></button></div><div id="evolution-preview" class="evolution-row"></div><p id="evolution-note" class="evolution-note" hidden></p></section></section>
</div>
<nav class="device-controls" aria-label="图鉴操作"><button id="previous-pokemon" class="control" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg><span>上一只</span></button><button id="open-catalog" class="control find" type="button" aria-haspopup="dialog" disabled><img src="assets/pokeball.svg" alt=""><span>找伙伴</span></button><button id="favorite-pokemon" class="control favorite" type="button" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6c-2-2-5.2-2-7.2 0L12 6.2l-1.6-1.6a5.1 5.1 0 0 0-7.2 7.2L12 21l8.8-9.2a5.1 5.1 0 0 0 0-7.2Z"/></svg><span id="favorite-label">收藏</span></button><button id="next-pokemon" class="control" type="button" disabled><span>下一只</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button></nav>
</div><span class="small-mark" aria-hidden="true"></span>
</main>
<p id="selection-status" class="sr-only" role="status" aria-live="polite"></p>
<dialog id="catalog-dialog" class="device-dialog catalog-dialog" aria-labelledby="catalog-title"><header class="dialog-header"><h2 id="catalog-title">找伙伴</h2><button class="close-button" type="button" data-close="catalog-dialog" aria-label="关闭找伙伴">×</button></header><div class="dialog-content">
<div class="catalog-tabs" role="group" aria-label="伙伴分类"><button data-view="all" class="selected" type="button" aria-pressed="true">全部伙伴</button><button data-view="latest" type="button" aria-pressed="false">新伙伴</button><button data-view="favorites" type="button" aria-pressed="false">我的收藏 <span id="favorite-count">0</span></button></div>
<div class="catalog-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><label class="sr-only" for="search">搜索宝可梦名字或编号</label><input id="search" type="search" placeholder="中文名、英文名或编号" autocomplete="off" enterkeyhint="search"><button id="clear-search" type="button" aria-label="清空搜索" hidden>×</button></div>
<details class="catalog-filters"><summary>按属性或世代找</summary><div class="filter-controls"><label for="filter-type">属性<select id="filter-type"><option value="all">全部属性</option></select></label><label for="filter-generation">世代<select id="filter-generation"><option value="all">全部世代</option><option value="1">第一世代</option><option value="2">第二世代</option><option value="3">第三世代</option><option value="4">第四世代</option><option value="5">第五世代</option><option value="6">第六世代</option><option value="7">第七世代</option><option value="8">第八世代</option><option value="9">第九世代</option><option value="10">最新公布</option></select></label><button id="reset-catalog" type="button">重置条件</button></div></details>
<p id="catalog-results" class="catalog-results" role="status" aria-live="polite"></p><p id="catalog-view-note" class="catalog-view-note" hidden></p><div id="catalog-grid" class="catalog-grid"></div>
<div id="catalog-empty" class="empty-state" hidden><img src="assets/pokeball.svg" alt=""><h3 id="empty-title">还没找到这位伙伴</h3><p id="empty-description">换个名字，或者清除筛选再试试。</p><button id="empty-reset" class="primary-button" type="button">查看全部伙伴</button></div>
<nav id="catalog-pagination" class="pagination" aria-label="图片目录翻页"><button id="catalog-previous" type="button">‹ 上一页</button><p id="catalog-page-label"></p><button id="catalog-next" type="button">下一页 ›</button></nav></div></dialog>
<dialog id="form-dialog" class="device-dialog form-dialog" aria-labelledby="form-title"><header class="dialog-header"><h2 id="form-title">换个样子</h2><button class="close-button" type="button" data-close="form-dialog" aria-label="关闭形态选择">×</button></header><div class="dialog-content"><p class="dialog-intro">选一张图片，看看它的另一个样子。</p><div id="form-grid" class="form-grid"></div><p class="source-note">地区形态、超级进化和普通进化是不同的变化。</p></div></dialog>
<dialog id="more-dialog" class="device-dialog more-dialog" aria-labelledby="more-title"><header class="dialog-header"><h2 id="more-title">更多资料</h2><button class="close-button" type="button" data-close="more-dialog" aria-label="关闭更多资料">×</button></header><div id="more-content" class="dialog-content"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div><noscript><p class="noscript-message">请在浏览器中开启 JavaScript，打开宝可梦图鉴。</p></noscript>
</body></html>
